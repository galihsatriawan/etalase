name: Prototype tests

on:
  push:
    paths: ["prototype/**", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/demo.py
      - name: End to end over real HTTP (own server, mock adapters)
        run: python scripts/e2e_http.py
      - name: Offline setup doctor and extraction baseline
        run: |
          python -m etalase.doctor --offline
          python -m evals.run_eval --extractor heuristic
